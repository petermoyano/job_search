name: Test and deploy backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_REGION: sa-east-1
  AWS_ROLE_ARN: arn:aws:iam::535379468109:role/job-search-github-deploy
  ECR_REPOSITORY: job-search-api
  LAMBDA_FUNCTION: job-search-api
  WORKER_LAMBDA_FUNCTION: job-search-document-processor
  FRONTEND_ORIGIN: https://job-search-fe.vercel.app
  FRONTEND_PREVIEW_ORIGIN: https://job-search-preview-petermoyanos-projects.vercel.app

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

  deploy:
    name: Deploy to production
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.function-url.outputs.url }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: job-search-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Build and push immutable API and worker images
        id: build-images
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          API_IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          WORKER_IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG-worker"

          docker buildx build \
            --file Dockerfile.lambda \
            --platform linux/amd64 \
            --provenance=false \
            --pull \
            --load \
            --tag "$API_IMAGE_URI" \
            .
          docker push "$API_IMAGE_URI"

          docker buildx build \
            --file Dockerfile.worker \
            --platform linux/amd64 \
            --provenance=false \
            --pull \
            --load \
            --tag "$WORKER_IMAGE_URI" \
            .
          docker push "$WORKER_IMAGE_URI"

          echo "api_image=$API_IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "worker_image=$WORKER_IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Deploy API and worker Lambda images
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --image-uri "${{ steps.build-images.outputs.api_image }}" \
            --query '{FunctionName:FunctionName,Version:Version,State:State}'
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION"

          aws lambda update-function-code \
            --function-name "$WORKER_LAMBDA_FUNCTION" \
            --image-uri "${{ steps.build-images.outputs.worker_image }}" \
            --query '{FunctionName:FunctionName,Version:Version,State:State}'
          aws lambda wait function-updated \
            --function-name "$WORKER_LAMBDA_FUNCTION"

      - name: Read Function URL
        id: function-url
        run: |
          FUNCTION_URL="$(aws lambda get-function-url-config \
            --function-name "$LAMBDA_FUNCTION" \
            --query FunctionUrl \
            --output text)"
          echo "url=${FUNCTION_URL%/}" >> "$GITHUB_OUTPUT"

      - name: Verify production health and CORS
        env:
          API_BASE_URL: ${{ steps.function-url.outputs.url }}
        run: |
          HEALTH_RESPONSE="$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 3 \
            --max-time 30 \
            "$API_BASE_URL/health")"
          test "$HEALTH_RESPONSE" = '{"status":"ok"}'

          HEADER_FILE="$(mktemp)"
          for origin in "$FRONTEND_ORIGIN" "$FRONTEND_PREVIEW_ORIGIN"; do
            curl \
              --fail \
              --silent \
              --show-error \
              --request OPTIONS \
              --header "Origin: $origin" \
              --header "Access-Control-Request-Method: POST" \
              --header "Access-Control-Request-Headers: content-type" \
              --dump-header "$HEADER_FILE" \
              --output /dev/null \
              "$API_BASE_URL/radar/runs"
            grep --fixed-strings --ignore-case \
              "access-control-allow-origin: $origin" \
              "$HEADER_FILE"
          done

      - name: Add deployment summary
        env:
          API_BASE_URL: ${{ steps.function-url.outputs.url }}
        run: |
          {
            echo "### Production deployment"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- API image: \`${{ steps.build-images.outputs.api_image }}\`"
            echo "- Worker image: \`${{ steps.build-images.outputs.worker_image }}\`"
            echo "- API function: \`$LAMBDA_FUNCTION\`"
            echo "- Worker function: \`$WORKER_LAMBDA_FUNCTION\`"
            echo "- API: $API_BASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
