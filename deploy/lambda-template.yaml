AWSTemplateFormatVersion: "2010-09-09"
Description: On-demand Lambda Function URL deployment for the job-search FastAPI backend.

Parameters:
  ImageUri:
    Type: String
    Description: Immutable ECR image URI for the Lambda-compatible backend image.
  WorkerImageUri:
    Type: String
    Description: Immutable ECR image URI for the document processing worker.
  QualityReviewWorkerImageUri:
    Type: String
    Description: Immutable ECR image URI for the Radar quality-review worker and dispatcher.
  RadarQualityReviewModelId:
    Type: String
    Default: mistral.ministral-3-14b-instruct
    Description: In-region Bedrock model used by the Radar quality reviewer.
  FrontendOrigin:
    Type: String
    Default: https://job-search-fe.vercel.app
  FrontendOriginRegex:
    Type: String
    Default: '^https://job-search-[a-z0-9-]+-petermoyanos-projects[.]vercel[.]app$'
    Description: Narrow allowlist pattern for this project's Vercel deployment URLs.
  DocumentUploadCorsOrigins:
    Type: CommaDelimitedList
    Default: >-
      http://localhost:3000,http://127.0.0.1:3000,https://job-search-fe.vercel.app,https://151.vercel.app,https://151-phi.vercel.app
    Description: Exact browser origins allowed to PUT documents with presigned URLs.
  DocumentsMaxFileSizeBytes:
    Type: Number
    Default: 20971520
    MinValue: 1
    Description: Maximum accepted PDF size in bytes.
  DocumentsUploadUrlExpiresSeconds:
    Type: Number
    Default: 900
    MinValue: 60
    MaxValue: 3600
  DocumentProcessingVisibilityTimeoutSeconds:
    Type: Number
    Default: 360
    MinValue: 60
  DocumentProcessingMaxReceiveCount:
    Type: Number
    Default: 3
    MinValue: 1
  DocumentProcessingBatchSize:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
  ResumeProcessingModelId:
    Type: String
    Default: mistral.ministral-3-14b-instruct
  CraneChatModelId:
    Type: String
    Default: mistral.ministral-3-3b-instruct
    Description: In-region Bedrock model used for resume classification and extraction.
  ResumeMinExtractedCharacters:
    Type: Number
    Default: 100
    MinValue: 1
  ResumeMaxModelInputCharacters:
    Type: Number
    Default: 60000
    MinValue: 100
  ResumeAcceptConfidence:
    Type: Number
    Default: 0.80
  ResumeRejectLowConfidence:
    Type: Number
    Default: 0.40
  ResumeNotResumeRejectConfidence:
    Type: Number
    Default: 0.80
  CraneKnowledgeBaseEmbeddingModelId:
    Type: String
    Default: cohere.embed-multilingual-v3
    Description: In-region Bedrock embedding model used by the Crane Intelligence knowledge base.
  CraneKnowledgeBaseName:
    Type: String
    Default: job-search-crane-rag-v2
    Description: Versioned Bedrock Knowledge Base name, changed deliberately when replacement is required.
  JobSearchTenantId:
    Type: String
    Default: job-search
  CraneIntelligenceTenantId:
    Type: String
    Default: creactis
  TavilySecretId:
    Type: String
    Default: job-search/tavily-api-key
  DatabaseUrlParameterName:
    Type: String
    Default: /job-search/database-url
    Description: Name of the SSM SecureString containing the pooled PostgreSQL URL.

Resources:
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/job-search-api
      RetentionInDays: 14
      Tags:
        - Key: Application
          Value: job-search

  DocumentProcessingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/job-search-document-processor
      RetentionInDays: 14
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: documents

  KnowledgeSyncLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/job-search-knowledge-sync
      RetentionInDays: 14
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: knowledge

  QualityReviewWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/job-search-quality-review-worker
      RetentionInDays: 14
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: radar

  QualityReviewDispatcherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/job-search-quality-review-dispatcher
      RetentionInDays: 14
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: radar

  DocumentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Suspended
      LifecycleConfiguration:
        Rules:
          - Id: RemoveIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: ExpireOldNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - content-type
              - x-amz-meta-document-id
            AllowedMethods:
              - PUT
            AllowedOrigins: !Ref DocumentUploadCorsOrigins
            ExposedHeaders:
              - ETag
            MaxAge: 900
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: documents

  DocumentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DocumentBucket.Arn
              - !Sub '${DocumentBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: "false"

  CraneKnowledgeVectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: knowledge
        - Key: SourceApplication
          Value: crane-intelligence

  CraneKnowledgeVectorIndex:
    Type: AWS::S3Vectors::Index
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VectorBucketArn: !GetAtt CraneKnowledgeVectorBucket.VectorBucketArn
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine
      MetadataConfiguration:
        NonFilterableMetadataKeys:
          - AMAZON_BEDROCK_TEXT
          - AMAZON_BEDROCK_METADATA
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: knowledge
        - Key: SourceApplication
          Value: crane-intelligence

  CraneKnowledgeBaseExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: job-search-crane-knowledge-base
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*
      Policies:
        - PolicyName: InvokeCraneKnowledgeEmbeddingModel
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${CraneKnowledgeBaseEmbeddingModelId}
        - PolicyName: ReadCraneKnowledgeDocuments
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt DocumentBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Sub documents/${CraneIntelligenceTenantId}/crane-intelligence/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub ${DocumentBucket.Arn}/documents/${CraneIntelligenceTenantId}/crane-intelligence/*
        - PolicyName: AccessCraneKnowledgeVectorIndex
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3vectors:DeleteVectors
                  - s3vectors:GetIndex
                  - s3vectors:GetVectors
                  - s3vectors:PutVectors
                  - s3vectors:QueryVectors
                Resource: !Ref CraneKnowledgeVectorIndex
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: knowledge
        - Key: SourceApplication
          Value: crane-intelligence

  CraneKnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    DependsOn:
      - CraneKnowledgeVectorIndex
      - CraneKnowledgeBaseExecutionRole
    Properties:
      Name: !Ref CraneKnowledgeBaseName
      Description: Retrieval knowledge base for Crane Intelligence documents.
      RoleArn: !GetAtt CraneKnowledgeBaseExecutionRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${CraneKnowledgeBaseEmbeddingModelId}
      StorageConfiguration:
        Type: S3_VECTORS
        S3VectorsConfiguration:
          VectorBucketArn: !GetAtt CraneKnowledgeVectorBucket.VectorBucketArn
          IndexArn: !Ref CraneKnowledgeVectorIndex
      Tags:
        Application: job-search
        BoundedContext: knowledge
        SourceApplication: crane-intelligence

  CraneKnowledgeDataSource:
    Type: AWS::Bedrock::DataSource
    DependsOn: CraneKnowledgeBase
    Properties:
      Name: job-search-crane-documents
      Description: Crane Intelligence documents restricted to the configured tenant prefix.
      KnowledgeBaseId: !Ref CraneKnowledgeBase
      DataDeletionPolicy: DELETE
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !GetAtt DocumentBucket.Arn
          InclusionPrefixes:
            - !Sub documents/${CraneIntelligenceTenantId}/crane-intelligence/
      VectorIngestionConfiguration:
        ChunkingConfiguration:
          ChunkingStrategy: FIXED_SIZE
          FixedSizeChunkingConfiguration:
            MaxTokens: 300
            OverlapPercentage: 20
  DocumentProcessingDeadLetterQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: documents
        - Key: QueueRole
          Value: dead-letter

  DocumentProcessingQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600
      VisibilityTimeout: !Ref DocumentProcessingVisibilityTimeoutSeconds
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DocumentProcessingDeadLetterQueue.Arn
        maxReceiveCount: !Ref DocumentProcessingMaxReceiveCount
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: documents
        - Key: QueueRole
          Value: processing

  QualityReviewDeadLetterQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: radar
        - Key: QueueRole
          Value: quality-review-dead-letter

  QualityReviewQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt QualityReviewDeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: radar
        - Key: QueueRole
          Value: quality-review

  JobSearchDocumentClientSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Server-side document API credential for the job-search application.
      GenerateSecretString:
        SecretStringTemplate: !Sub >-
          {"source_app":"job-search","tenant_ids":["${JobSearchTenantId}"]}
        GenerateStringKey: client_secret
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: job-search
        - Key: DocumentSourceApp
          Value: job-search

  CraneIntelligenceDocumentClientSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Server-side document API credential for Crane Intelligence.
      GenerateSecretString:
        SecretStringTemplate: !Sub >-
          {"source_app":"crane-intelligence","tenant_ids":["${CraneIntelligenceTenantId}"]}
        GenerateStringKey: client_secret
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: job-search
        - Key: DocumentSourceApp
          Value: crane-intelligence

  BackendExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: job-search-lambda-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadDatabaseUrlParameter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub >-
                  arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseUrlParameterName}
        - PolicyName: ManageDocumentUploads
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListDocumentBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DocumentBucket.Arn
              - Sid: PutAndInspectDocumentObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${DocumentBucket.Arn}/documents/*'
              - Sid: ReadDocumentClientSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref JobSearchDocumentClientSecret
                  - !Ref CraneIntelligenceDocumentClientSecret
              - Sid: SendDocumentProcessingMessage
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt DocumentProcessingQueue.Arn
        - PolicyName: SendQualityReviewMessage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt QualityReviewQueue.Arn
        - PolicyName: RetrieveCraneKnowledge
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:Retrieve
                Resource: !GetAtt CraneKnowledgeBase.KnowledgeBaseArn
        - PolicyName: GenerateCraneChat
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub >-
                  arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${CraneChatModelId}
      Tags:
        - Key: Application
          Value: job-search

  QualityReviewWorkerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: job-search-quality-review-worker
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadDatabaseUrlParameter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub >-
                  arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseUrlParameterName}
        - PolicyName: ConsumeQualityReviewQueue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt QualityReviewQueue.Arn
        - PolicyName: InvokeQualityReviewModel
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub >-
                  arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${RadarQualityReviewModelId}
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: radar

  QualityReviewDispatcherExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: job-search-quality-review-dispatcher
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadDatabaseUrlParameter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub >-
                  arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseUrlParameterName}
        - PolicyName: DispatchQualityReviewMessages
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt QualityReviewQueue.Arn
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: radar

  DocumentProcessingExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: job-search-document-processing
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadDatabaseUrlParameter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub >-
                  arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseUrlParameterName}
        - PolicyName: ConsumeDocumentProcessingQueue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt DocumentProcessingQueue.Arn
        - PolicyName: ReadDocumentObjects
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListDocumentPrefix
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DocumentBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - documents/*
              - Sid: ReadDocumentObjects
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${DocumentBucket.Arn}/documents/*'
        - PolicyName: InvokeResumeProcessingModel
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub >-
                  arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${ResumeProcessingModelId}
        - PolicyName: WriteCraneKnowledgeMetadata
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${DocumentBucket.Arn}/documents/${CraneIntelligenceTenantId}/crane-intelligence/*
        - PolicyName: StartCraneKnowledgeIngestion
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:StartIngestionJob
                Resource: !GetAtt CraneKnowledgeBase.KnowledgeBaseArn
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: documents

  DocumentProcessingFunction:
    Type: AWS::Lambda::Function
    DependsOn: DocumentProcessingLogGroup
    Properties:
      FunctionName: job-search-document-processor
      Description: Asynchronous preprocessing and policy-based document processing.
      PackageType: Image
      Code:
        ImageUri: !Ref WorkerImageUri
      Role: !GetAtt DocumentProcessingExecutionRole.Arn
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 180
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          APP_ENV: production
          DATABASE_URL_SSM_PARAMETER: !Ref DatabaseUrlParameterName
          INITIALIZE_DATABASE: "false"
          DOCUMENTS_MAX_FILE_SIZE_BYTES: !Ref DocumentsMaxFileSizeBytes
          DOCUMENT_PROCESSING_LEASE_SECONDS: "300"
          RESUME_PROCESSING_MODEL_ID: !Ref ResumeProcessingModelId
          RESUME_PROCESSING_BEDROCK_REGION: !Ref AWS::Region
          KNOWLEDGE_BASE_ID: !Ref CraneKnowledgeBase
          KNOWLEDGE_BASE_DATA_SOURCE_ID: !GetAtt CraneKnowledgeDataSource.DataSourceId
          KNOWLEDGE_BASE_REGION: !Ref AWS::Region
          RESUME_MIN_EXTRACTED_CHARACTERS: !Ref ResumeMinExtractedCharacters
          RESUME_MAX_MODEL_INPUT_CHARACTERS: !Ref ResumeMaxModelInputCharacters
          RESUME_ACCEPT_CONFIDENCE: !Ref ResumeAcceptConfidence
          RESUME_REJECT_LOW_CONFIDENCE: !Ref ResumeRejectLowConfidence
          RESUME_NOT_RESUME_REJECT_CONFIDENCE: !Ref ResumeNotResumeRejectConfidence
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: documents

  DocumentProcessingEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref DocumentProcessingFunction
      EventSourceArn: !GetAtt DocumentProcessingQueue.Arn
      Enabled: true
      BatchSize: !Ref DocumentProcessingBatchSize
      MaximumBatchingWindowInSeconds: 0
      FunctionResponseTypes:
        - ReportBatchItemFailures
  KnowledgeSyncExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: job-search-knowledge-sync
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadDatabaseUrlParameter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub >-
                  arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseUrlParameterName}
        - PolicyName: ReconcileCraneKnowledgeIngestion
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:StartIngestionJob
                  - bedrock:GetIngestionJob
                Resource: !GetAtt CraneKnowledgeBase.KnowledgeBaseArn
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: knowledge

  KnowledgeSyncFunction:
    Type: AWS::Lambda::Function
    DependsOn: KnowledgeSyncLogGroup
    Properties:
      FunctionName: job-search-knowledge-sync
      Description: Reconciles Bedrock Knowledge Base ingestion jobs for Crane Intelligence.
      PackageType: Image
      Code:
        ImageUri: !Ref WorkerImageUri
      ImageConfig:
        Command:
          - app.knowledge.sync_worker.handler
      Role: !GetAtt KnowledgeSyncExecutionRole.Arn
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          APP_ENV: production
          DATABASE_URL_SSM_PARAMETER: !Ref DatabaseUrlParameterName
          INITIALIZE_DATABASE: "false"
          KNOWLEDGE_BASE_ID: !Ref CraneKnowledgeBase
          KNOWLEDGE_BASE_DATA_SOURCE_ID: !GetAtt CraneKnowledgeDataSource.DataSourceId
          KNOWLEDGE_BASE_REGION: !Ref AWS::Region
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: knowledge

  KnowledgeSyncSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Reconciles pending Crane Intelligence Knowledge Base ingestion jobs.
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt KnowledgeSyncFunction.Arn
          Id: KnowledgeSyncLambda

  KnowledgeSyncSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref KnowledgeSyncFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt KnowledgeSyncSchedule.Arn

  QualityReviewWorkerFunction:
    Type: AWS::Lambda::Function
    DependsOn: QualityReviewWorkerLogGroup
    Properties:
      FunctionName: job-search-quality-review-worker
      Description: SQS consumer for bounded Radar opportunity quality reviews.
      PackageType: Image
      Code:
        ImageUri: !Ref QualityReviewWorkerImageUri
      Role: !GetAtt QualityReviewWorkerExecutionRole.Arn
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 120
      Environment:
        Variables:
          APP_ENV: production
          DATABASE_URL_SSM_PARAMETER: !Ref DatabaseUrlParameterName
          INITIALIZE_DATABASE: "false"
          RADAR_QUALITY_REVIEW_MODEL_ID: !Ref RadarQualityReviewModelId
          RADAR_QUALITY_REVIEW_BEDROCK_REGION: !Ref AWS::Region
          RADAR_QUALITY_REVIEW_LEASE_SECONDS: "300"
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: radar

  QualityReviewEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref QualityReviewWorkerFunction
      EventSourceArn: !GetAtt QualityReviewQueue.Arn
      Enabled: true
      BatchSize: 5
      MaximumBatchingWindowInSeconds: 0
      FunctionResponseTypes:
        - ReportBatchItemFailures

  QualityReviewDispatcherFunction:
    Type: AWS::Lambda::Function
    DependsOn: QualityReviewDispatcherLogGroup
    Properties:
      FunctionName: job-search-quality-review-dispatcher
      Description: Retries delivery of pending Radar quality-review outbox events.
      PackageType: Image
      Code:
        ImageUri: !Ref QualityReviewWorkerImageUri
      ImageConfig:
        Command:
          - app.radar.quality.dispatch_handler
      Role: !GetAtt QualityReviewDispatcherExecutionRole.Arn
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          APP_ENV: production
          DATABASE_URL_SSM_PARAMETER: !Ref DatabaseUrlParameterName
          INITIALIZE_DATABASE: "false"
          RADAR_QUALITY_REVIEW_QUEUE_URL: !Ref QualityReviewQueue
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: radar

  QualityReviewOutboxDispatchSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Retries pending Radar quality-review outbox delivery.
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt QualityReviewDispatcherFunction.Arn
          Id: QualityReviewDispatcherLambda

  QualityReviewOutboxDispatchSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref QualityReviewDispatcherFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt QualityReviewOutboxDispatchSchedule.Arn

  GitHubWorkerDeployPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: job-search-worker-github-deploy
      Roles:
        - job-search-github-deploy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:UpdateFunctionCode
            Resource:
              - !GetAtt DocumentProcessingFunction.Arn
              - !GetAtt KnowledgeSyncFunction.Arn
              - !GetAtt QualityReviewWorkerFunction.Arn
              - !GetAtt QualityReviewDispatcherFunction.Arn

  BackendFunction:
    Type: AWS::Lambda::Function
    DependsOn: BackendLogGroup
    Properties:
      FunctionName: job-search-api
      Description: On-demand FastAPI backend for the job-search application.
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !GetAtt BackendExecutionRole.Arn
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 300
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          APP_ENV: production
          DATABASE_URL_SSM_PARAMETER: !Ref DatabaseUrlParameterName
          INITIALIZE_DATABASE: "false"
          CORS_ORIGINS: !Sub '["http://localhost:3000","http://127.0.0.1:3000","${FrontendOrigin}"]'
          CORS_ORIGIN_REGEX: !Ref FrontendOriginRegex
          TAVILY_API_KEY: !Sub '{{resolve:secretsmanager:${TavilySecretId}:SecretString}}'
          DOCUMENTS_S3_BUCKET: !Ref DocumentBucket
          DOCUMENTS_MAX_FILE_SIZE_BYTES: !Ref DocumentsMaxFileSizeBytes
          DOCUMENTS_UPLOAD_URL_EXPIRES_SECONDS: !Ref DocumentsUploadUrlExpiresSeconds
          DOCUMENT_PROCESSING_QUEUE_URL: !Ref DocumentProcessingQueue
          DOCUMENT_PROCESSING_LEASE_SECONDS: "300"
          RADAR_QUALITY_REVIEW_QUEUE_URL: !Ref QualityReviewQueue
          RADAR_QUALITY_REVIEW_MODEL_ID: !Ref RadarQualityReviewModelId
          RADAR_QUALITY_REVIEW_BEDROCK_REGION: !Ref AWS::Region
          DOCUMENT_CLIENT_SECRET_IDS: !Join
            - ","
            - - !Ref JobSearchDocumentClientSecret
              - !Ref CraneIntelligenceDocumentClientSecret
          AWS_LWA_PORT: "8000"
          KNOWLEDGE_BASE_ID: !Ref CraneKnowledgeBase
          KNOWLEDGE_BASE_DATA_SOURCE_ID: !GetAtt CraneKnowledgeDataSource.DataSourceId
          KNOWLEDGE_BASE_REGION: !Ref AWS::Region
          CRANE_CHAT_MODEL_ID: !Ref CraneChatModelId
          CRANE_CHAT_BEDROCK_REGION: !Ref AWS::Region
          AWS_LWA_READINESS_CHECK_PATH: /health
          AWS_LWA_ENABLE_COMPRESSION: "true"
      Tags:
        - Key: Application
          Value: job-search
        - Key: Environment
          Value: production

  BackendFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt BackendFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  PublicFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BackendFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  PublicFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BackendFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  FunctionName:
    Value: !Ref BackendFunction
  FunctionArn:
    Value: !GetAtt BackendFunction.Arn
  FunctionUrl:
    Value: !GetAtt BackendFunctionUrl.FunctionUrl
  ExecutionRoleArn:
    Value: !GetAtt BackendExecutionRole.Arn
  DocumentBucketName:
    Description: Private bucket containing original uploaded documents.
    Value: !Ref DocumentBucket
  JobSearchDocumentClientSecretArn:
    Description: Secret ARN for the job-search server-side client.
    Value: !Ref JobSearchDocumentClientSecret
  CraneIntelligenceDocumentClientSecretArn:
    Description: Secret ARN for the Crane Intelligence server-side client.
    Value: !Ref CraneIntelligenceDocumentClientSecret
  DocumentProcessingQueueUrl:
    Description: URL of the asynchronous document processing queue.
    Value: !Ref DocumentProcessingQueue
  DocumentProcessingQueueArn:
    Description: ARN of the asynchronous document processing queue.
    Value: !GetAtt DocumentProcessingQueue.Arn
  DocumentProcessingDeadLetterQueueUrl:
    Description: URL of the document processing dead letter queue.
    Value: !Ref DocumentProcessingDeadLetterQueue
  DocumentProcessingDeadLetterQueueArn:
    Description: ARN of the document processing dead letter queue.
    Value: !GetAtt DocumentProcessingDeadLetterQueue.Arn
  DocumentProcessingFunctionName:
    Value: !Ref DocumentProcessingFunction
  DocumentProcessingFunctionArn:
    Value: !GetAtt DocumentProcessingFunction.Arn
  DocumentProcessingExecutionRoleArn:
    Value: !GetAtt DocumentProcessingExecutionRole.Arn
  ResumeProcessingModelId:
    Description: Bedrock model used by the resume processing policy.
    Value: !Ref ResumeProcessingModelId
  KnowledgeSyncFunctionName:
    Description: Scheduled Lambda that reconciles Bedrock Knowledge Base ingestion jobs.
    Value: !Ref KnowledgeSyncFunction
  KnowledgeSyncFunctionArn:
    Value: !GetAtt KnowledgeSyncFunction.Arn
  CraneKnowledgeBaseId:
    Description: Bedrock Knowledge Base ID for Crane Intelligence retrieval.
    Value: !Ref CraneKnowledgeBase
  CraneKnowledgeDataSourceId:
    Description: S3 data source ID managed by the Crane Intelligence knowledge base.
    Value: !Ref CraneKnowledgeDataSource
  CraneKnowledgeVectorBucketArn:
    Description: S3 Vectors bucket ARN retained independently of the stack lifecycle.
    Value: !GetAtt CraneKnowledgeVectorBucket.VectorBucketArn
  CraneKnowledgeVectorIndexArn:
    Description: S3 Vectors index ARN used by the Crane Intelligence knowledge base.
    Value: !Ref CraneKnowledgeVectorIndex
  CraneKnowledgeBaseExecutionRoleArn:
    Description: Least-privilege Bedrock execution role for the Crane Intelligence knowledge base.
    Value: !GetAtt CraneKnowledgeBaseExecutionRole.Arn
  CraneKnowledgeBaseEmbeddingModelId:
    Description: Bedrock embedding model whose 1024 dimensions match the vector index.
    Value: !Ref CraneKnowledgeBaseEmbeddingModelId
  QualityReviewQueueUrl:
    Description: URL of the asynchronous Radar quality-review queue.
    Value: !Ref QualityReviewQueue
  QualityReviewDeadLetterQueueUrl:
    Description: URL of the Radar quality-review dead-letter queue.
    Value: !Ref QualityReviewDeadLetterQueue
  QualityReviewWorkerFunctionName:
    Description: SQS-triggered Lambda that evaluates presented Radar opportunities.
    Value: !Ref QualityReviewWorkerFunction
  QualityReviewDispatcherFunctionName:
    Description: Scheduled Lambda that retries pending quality-review outbox delivery.
    Value: !Ref QualityReviewDispatcherFunction
