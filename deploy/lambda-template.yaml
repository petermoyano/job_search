AWSTemplateFormatVersion: "2010-09-09"
Description: On-demand Lambda Function URL deployment for the job-search FastAPI backend.

Parameters:
  ImageUri:
    Type: String
    Description: Immutable ECR image URI for the Lambda-compatible backend image.
  WorkerImageUri:
    Type: String
    Description: Immutable ECR image URI for the document processing worker.
  FrontendOrigin:
    Type: String
    Default: https://job-search-fe.vercel.app
  FrontendOriginRegex:
    Type: String
    Default: '^https://job-search-[a-z0-9-]+-petermoyanos-projects[.]vercel[.]app$'
    Description: Narrow allowlist pattern for this project's Vercel deployment URLs.
  DocumentUploadCorsOrigins:
    Type: CommaDelimitedList
    Default: >-
      http://localhost:3000,http://127.0.0.1:3000,https://job-search-fe.vercel.app,https://151.vercel.app
    Description: Exact browser origins allowed to PUT documents with presigned URLs.
  DocumentsMaxFileSizeBytes:
    Type: Number
    Default: 20971520
    MinValue: 1
    Description: Maximum accepted PDF size in bytes.
  DocumentsUploadUrlExpiresSeconds:
    Type: Number
    Default: 900
    MinValue: 60
    MaxValue: 3600
  DocumentProcessingVisibilityTimeoutSeconds:
    Type: Number
    Default: 360
    MinValue: 60
  DocumentProcessingMaxReceiveCount:
    Type: Number
    Default: 3
    MinValue: 1
  DocumentProcessingBatchSize:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 10
  JobSearchTenantId:
    Type: String
    Default: job-search
  CraneIntelligenceTenantId:
    Type: String
    Default: creactis
  TavilySecretId:
    Type: String
    Default: job-search/tavily-api-key
  DatabaseUrlParameterName:
    Type: String
    Default: /job-search/database-url
    Description: Name of the SSM SecureString containing the pooled PostgreSQL URL.

Resources:
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/job-search-api
      RetentionInDays: 14
      Tags:
        - Key: Application
          Value: job-search

  DocumentProcessingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/job-search-document-processor
      RetentionInDays: 14
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: documents

  DocumentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: RemoveIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: ExpireOldNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - content-type
              - x-amz-meta-document-id
            AllowedMethods:
              - PUT
            AllowedOrigins: !Ref DocumentUploadCorsOrigins
            ExposedHeaders:
              - ETag
            MaxAge: 900
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: documents

  DocumentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DocumentBucket.Arn
              - !Sub '${DocumentBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: "false"

  DocumentProcessingDeadLetterQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: documents
        - Key: QueueRole
          Value: dead-letter

  DocumentProcessingQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600
      VisibilityTimeout: !Ref DocumentProcessingVisibilityTimeoutSeconds
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DocumentProcessingDeadLetterQueue.Arn
        maxReceiveCount: !Ref DocumentProcessingMaxReceiveCount
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: documents
        - Key: QueueRole
          Value: processing

  JobSearchDocumentClientSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Server-side document API credential for the job-search application.
      GenerateSecretString:
        SecretStringTemplate: !Sub >-
          {"source_app":"job-search","tenant_ids":["${JobSearchTenantId}"]}
        GenerateStringKey: client_secret
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: job-search
        - Key: DocumentSourceApp
          Value: job-search

  CraneIntelligenceDocumentClientSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Server-side document API credential for Crane Intelligence.
      GenerateSecretString:
        SecretStringTemplate: !Sub >-
          {"source_app":"crane-intelligence","tenant_ids":["${CraneIntelligenceTenantId}"]}
        GenerateStringKey: client_secret
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: job-search
        - Key: DocumentSourceApp
          Value: crane-intelligence

  BackendExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: job-search-lambda-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadDatabaseUrlParameter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub >-
                  arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseUrlParameterName}
        - PolicyName: ManageDocumentUploads
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListDocumentBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DocumentBucket.Arn
              - Sid: PutAndInspectDocumentObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${DocumentBucket.Arn}/documents/*'
              - Sid: ReadDocumentClientSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref JobSearchDocumentClientSecret
                  - !Ref CraneIntelligenceDocumentClientSecret
              - Sid: SendDocumentProcessingMessage
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt DocumentProcessingQueue.Arn
      Tags:
        - Key: Application
          Value: job-search

  DocumentProcessingExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: job-search-document-processing
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadDatabaseUrlParameter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub >-
                  arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseUrlParameterName}
        - PolicyName: ConsumeDocumentProcessingQueue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt DocumentProcessingQueue.Arn
        - PolicyName: ReadDocumentObjects
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListDocumentPrefix
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DocumentBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - documents/*
              - Sid: ReadDocumentObjects
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${DocumentBucket.Arn}/documents/*'
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: documents

  DocumentProcessingFunction:
    Type: AWS::Lambda::Function
    DependsOn: DocumentProcessingLogGroup
    Properties:
      FunctionName: job-search-document-processor
      Description: Asynchronous deterministic preprocessing for uploaded documents.
      PackageType: Image
      Code:
        ImageUri: !Ref WorkerImageUri
      Role: !GetAtt DocumentProcessingExecutionRole.Arn
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 60
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          APP_ENV: production
          DATABASE_URL_SSM_PARAMETER: !Ref DatabaseUrlParameterName
          INITIALIZE_DATABASE: "false"
          DOCUMENTS_MAX_FILE_SIZE_BYTES: !Ref DocumentsMaxFileSizeBytes
          DOCUMENT_PROCESSING_LEASE_SECONDS: "300"
      Tags:
        - Key: Application
          Value: job-search
        - Key: BoundedContext
          Value: documents

  DocumentProcessingEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref DocumentProcessingFunction
      EventSourceArn: !GetAtt DocumentProcessingQueue.Arn
      Enabled: true
      BatchSize: !Ref DocumentProcessingBatchSize
      MaximumBatchingWindowInSeconds: 0
      FunctionResponseTypes:
        - ReportBatchItemFailures

  GitHubWorkerDeployPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: job-search-worker-github-deploy
      Roles:
        - job-search-github-deploy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:UpdateFunctionCode
            Resource: !GetAtt DocumentProcessingFunction.Arn

  BackendFunction:
    Type: AWS::Lambda::Function
    DependsOn: BackendLogGroup
    Properties:
      FunctionName: job-search-api
      Description: On-demand FastAPI backend for the job-search application.
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !GetAtt BackendExecutionRole.Arn
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 300
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          APP_ENV: production
          DATABASE_URL_SSM_PARAMETER: !Ref DatabaseUrlParameterName
          INITIALIZE_DATABASE: "false"
          CORS_ORIGINS: !Sub '["http://localhost:3000","http://127.0.0.1:3000","${FrontendOrigin}"]'
          CORS_ORIGIN_REGEX: !Ref FrontendOriginRegex
          TAVILY_API_KEY: !Sub '{{resolve:secretsmanager:${TavilySecretId}:SecretString}}'
          DOCUMENTS_S3_BUCKET: !Ref DocumentBucket
          DOCUMENTS_MAX_FILE_SIZE_BYTES: !Ref DocumentsMaxFileSizeBytes
          DOCUMENTS_UPLOAD_URL_EXPIRES_SECONDS: !Ref DocumentsUploadUrlExpiresSeconds
          DOCUMENT_PROCESSING_QUEUE_URL: !Ref DocumentProcessingQueue
          DOCUMENT_PROCESSING_LEASE_SECONDS: "300"
          DOCUMENT_CLIENT_SECRET_IDS: !Join
            - ","
            - - !Ref JobSearchDocumentClientSecret
              - !Ref CraneIntelligenceDocumentClientSecret
          AWS_LWA_PORT: "8000"
          AWS_LWA_READINESS_CHECK_PATH: /health
          AWS_LWA_ENABLE_COMPRESSION: "true"
      Tags:
        - Key: Application
          Value: job-search
        - Key: Environment
          Value: production

  BackendFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt BackendFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  PublicFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BackendFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  PublicFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BackendFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  FunctionName:
    Value: !Ref BackendFunction
  FunctionArn:
    Value: !GetAtt BackendFunction.Arn
  FunctionUrl:
    Value: !GetAtt BackendFunctionUrl.FunctionUrl
  ExecutionRoleArn:
    Value: !GetAtt BackendExecutionRole.Arn
  DocumentBucketName:
    Description: Private bucket containing original uploaded documents.
    Value: !Ref DocumentBucket
  JobSearchDocumentClientSecretArn:
    Description: Secret ARN for the job-search server-side client.
    Value: !Ref JobSearchDocumentClientSecret
  CraneIntelligenceDocumentClientSecretArn:
    Description: Secret ARN for the Crane Intelligence server-side client.
    Value: !Ref CraneIntelligenceDocumentClientSecret
  DocumentProcessingQueueUrl:
    Description: URL of the asynchronous document processing queue.
    Value: !Ref DocumentProcessingQueue
  DocumentProcessingQueueArn:
    Description: ARN of the asynchronous document processing queue.
    Value: !GetAtt DocumentProcessingQueue.Arn
  DocumentProcessingDeadLetterQueueUrl:
    Description: URL of the document processing dead letter queue.
    Value: !Ref DocumentProcessingDeadLetterQueue
  DocumentProcessingDeadLetterQueueArn:
    Description: ARN of the document processing dead letter queue.
    Value: !GetAtt DocumentProcessingDeadLetterQueue.Arn
  DocumentProcessingFunctionName:
    Value: !Ref DocumentProcessingFunction
  DocumentProcessingFunctionArn:
    Value: !GetAtt DocumentProcessingFunction.Arn
  DocumentProcessingExecutionRoleArn:
    Value: !GetAtt DocumentProcessingExecutionRole.Arn
