AWSTemplateFormatVersion: "2010-09-09"
Description: On-demand Lambda Function URL deployment for the job-search FastAPI backend.

Parameters:
  ImageUri:
    Type: String
    Description: Immutable ECR image URI for the Lambda-compatible backend image.
  FrontendOrigin:
    Type: String
    Default: https://job-search-fe.vercel.app
  TavilySecretId:
    Type: String
    Default: job-search/tavily-api-key
  DatabaseUrlParameterName:
    Type: String
    Default: /job-search/database-url
    Description: Name of the SSM SecureString containing the pooled PostgreSQL URL.

Resources:
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/job-search-api
      RetentionInDays: 14
      Tags:
        - Key: Application
          Value: job-search

  BackendExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: job-search-lambda-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadDatabaseUrlParameter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub >-
                  arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseUrlParameterName}
      Tags:
        - Key: Application
          Value: job-search

  BackendFunction:
    Type: AWS::Lambda::Function
    DependsOn: BackendLogGroup
    Properties:
      FunctionName: job-search-api
      Description: On-demand FastAPI backend for the job-search application.
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !GetAtt BackendExecutionRole.Arn
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 300
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          APP_ENV: production
          DATABASE_URL_SSM_PARAMETER: !Ref DatabaseUrlParameterName
          INITIALIZE_DATABASE: "false"
          CORS_ORIGINS: !Sub '["http://localhost:3000","http://127.0.0.1:3000","${FrontendOrigin}"]'
          TAVILY_API_KEY: !Sub '{{resolve:secretsmanager:${TavilySecretId}:SecretString}}'
          AWS_LWA_PORT: "8000"
          AWS_LWA_READINESS_CHECK_PATH: /health
          AWS_LWA_ENABLE_COMPRESSION: "true"
      Tags:
        - Key: Application
          Value: job-search
        - Key: Environment
          Value: production

  BackendFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt BackendFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED
      Cors:
        AllowCredentials: false
        AllowHeaders:
          - "*"
        AllowMethods:
          - "*"
        AllowOrigins:
          - !Ref FrontendOrigin
        MaxAge: 86400

  PublicFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BackendFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  PublicFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BackendFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  FunctionName:
    Value: !Ref BackendFunction
  FunctionArn:
    Value: !GetAtt BackendFunction.Arn
  FunctionUrl:
    Value: !GetAtt BackendFunctionUrl.FunctionUrl
  ExecutionRoleArn:
    Value: !GetAtt BackendExecutionRole.Arn
